{% load static %}
{% include "./pages/header.html" %}

<section class="product-detail">
    <div class="cardproduct">

        <img src="{{ product.imagem_final }}" alt="{{ product.nome }}">

        <h2>{{ product.nome }}</h2>
        <p class="price">R$ {{ product.preco }}</p>

        {% if product.descricao %}
            <p>{{ product.descricao }}</p>
        {% endif %}

        <p class="categoria">
            Categoria: {{ product.categoria.nome }}
        </p>
        <a href="{% url "WhatsApp" product.id %}"
            class="btn"
            target="_blank">
        Comprar no WhatsApp
        </a>
        <a href="{% url 'list_produtos' %}" class="btn">Voltar</a>
    </div>
</section>

{% include "./pages/footer.html" %}
