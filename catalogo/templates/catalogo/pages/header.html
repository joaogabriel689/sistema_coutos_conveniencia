{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Couto's Conveniência | Loja de Conveniência em Campo Grande</title>
    <meta name="description" content="Couto's Conveniência em Campo Grande. Bebidas geladas, snacks, promoções e atendimento rápido. Veja nossos produtos e fale conosco pelo WhatsApp.">
    <link rel="stylesheet" href="{% static 'styles/style.css' %}">
    <link rel="shortcut icon" href="{% static 'images/system/favicon.ico' %}" type="image/x-icon">
    <!-- JSON vindo do backend -->
    <script id="subcategories-data" type="application/json">
        {{ subcategories_json|safe }}
    </script>
    <script src="{% static 'scripts/scripts.js' %}" defer></script>
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "ConvenienceStore",
        "name": "Couto's Conveniência",
        "image": "https://SEUSITE.com/static/images/system/logo_landinpage.png",
        "address": {
            "@type": "PostalAddress",
            "streetAddress": "Rua ministro jose linhares 1579",
            "addressLocality": "Campo Grande",
            "addressRegion": "MS",
            "addressCountry": "BR"
        },
        "telephone": "+55 67 99240-4458",
        "openingHours": "Mo-Su 08:00-23:00"
    }
    </script>
</head>
<body>

<header class="header">
    <div class="logo">
        <img src="{% static 'images/system/logo_landinpage.png' %}" alt="Logo Couto's Conveniência">
    </div>
    <nav class="botoes">
        <ul>
            <li><a href="{% url 'index' %}">Início</a></li>
            <li><a href="{% url 'list_produtos' %}">Produtos</a></li>
            <li><a href="{% url 'contact' %}">Contato</a></li>
        </ul>
    </nav>
</header>
